trigger:
- master

pool:
  vmImage: 'windows-latest'
  
variables:
  solution: '**/*.sln'
  buildPlatform: 'Any CPU'
  buildConfiguration: 'Release'

steps:
- powershell: |
    $content = Get-Content Properties\AssemblyInfo.cs -Raw
    if ($content -notmatch 'AssemblyVersion\("([\d\.]+)"\)') { throw 'AssemblyVersion not found in Properties\AssemblyInfo.cs' }
    Write-Host "##vso[build.updatebuildnumber]$($Matches[1])"
  displayName: Set build number from AssemblyVersion

- task: NuGetToolInstaller@1

- task: NuGetCommand@2
  inputs:
    restoreSolution: '$(solution)'
    
- task: VSBuild@1
  inputs:
    solution: '$(solution)'
    platform: '$(buildPlatform)'
    configuration: '$(buildConfiguration)'
    
- task: PublishPipelineArtifact@1
  inputs:
    targetPath: $(System.DefaultWorkingDirectory)\bin\Release\net8.0-windows\win-x64
    artifactName: KioskAssistant